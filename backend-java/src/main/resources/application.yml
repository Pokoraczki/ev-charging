server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ev_charging_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  payment:
    gateway:
      url: https://api.sandbox.paymentgateway.hu/v1
      merchant-key: "YOUR_MERCHANT_KEY_HERE"
      timeout-ms: 5000