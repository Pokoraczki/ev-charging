server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ev_charging_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
payment:
  gateway:
    url: "https://api.mockbank.hu/v1/authorize"
    merchant-key: "YOUR_MERCHANT_KEY_HERE"